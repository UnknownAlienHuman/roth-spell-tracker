name: Retail 12.1 boundary audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run read-only audit
        run: python3 tools/audit_retail_12_1.py

      - name: Run strict blocker classification
        continue-on-error: true
        run: python3 tools/audit_retail_12_1.py --strict

      - name: Upload machine-readable report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roth-spell-tracker-retail-12-1-audit
          path: artifacts/retail-12-1-audit.json
          if-no-files-found: error
          retention-days: 14
